name: deploy

# GitHub Pages publishes only from this workflow, after the checks workflow passes on a push to main,
# so a commit whose checks fail never goes live.
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # Checks for two quick pushes can finish out of order; only the newest main may go live.
      - name: Is this still the newest main?
        id: latest
        env:
          CHECKED: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$CHECKED" ]; then echo "newest=yes" >> "$GITHUB_OUTPUT"; else echo "main moved on to $tip; skipping $CHECKED"; echo "newest=no" >> "$GITHUB_OUTPUT"; fi
      - if: steps.latest.outputs.newest == 'yes'
        uses: actions/configure-pages@v5
      - if: steps.latest.outputs.newest == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - if: steps.latest.outputs.newest == 'yes'
        id: deployment
        uses: actions/deploy-pages@v4
